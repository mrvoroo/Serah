name: Fetch assets (tooling only)
on:
  push:
    branches: [ci/assets]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/assets.sh
      - name: Push results to ci/assets-out
        run: |
          cd out
          git init -q -b ci/assets-out
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "assets"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/assets-out
