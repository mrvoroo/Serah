name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # البناء والنشر في مهمتين منفصلتين (زي قالب GitHub الرسمي): النشر في نفس المهمة كان أحيانًا ما يلاقيش الملف المرفوع
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: ""  # الموقع على imuntaha.com من الجذر (التطوير المحلي يبقى تحت /Serah)
          NEXT_TELEMETRY_DISABLED: "1"
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
