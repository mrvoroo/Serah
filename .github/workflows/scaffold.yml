name: Scaffold Next.js app (tooling only)
on:
  push:
    branches: [ci/scaffold]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/scaffold.sh
      - name: Pack sources and node_modules
        run: |
          cd app
          tar --exclude=node_modules --exclude=.next -czf ../app-src.tgz .
          tar -czf ../node_modules.tgz node_modules
          ls -la ..
      - name: Publish as a release (artifact downloads are blocked in the dev sandbox)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deps-${{ github.run_id }}"
          gh release create "$TAG" app-src.tgz node_modules.tgz --repo "${{ github.repository }}" --prerelease --title "$TAG" --notes "Tooling snapshot (sources + node_modules) for development."
